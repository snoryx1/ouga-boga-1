<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mini Battle Royale</title>
<style>
html,body{margin:0;background:#111;color:white;font-family:Arial}
#ui{position:fixed;top:10px;left:10px;z-index:10;background:#000a;padding:10px;border-radius:8px}
canvas{display:block;margin:0 auto;background:#0b1220}
button,input{margin:4px;padding:8px;border-radius:6px;border:0}
#joystick{position:fixed;bottom:20px;right:20px;width:120px;height:120px}
#pad{width:100%;height:100%;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center}
#stick{width:40px;height:40px;border-radius:50%;background:#888}
</style>
</head>
<body>

<div id="ui">
<button id="createBtn">Create</button>
<input id="roomInput" placeholder="ROOM">
<button id="joinBtn">Join</button>
<div>Room: <span id="roomCode">-</span></div>
<div id="status">Idle</div>
<div>Players: <span id="playersCount">0</span></div>
<button id="startBtn">Start</button>
</div>

<canvas id="game" width="800" height="500"></canvas>

<div id="joystick">
<div id="pad"><div id="stick"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBExGBqXG-rnK1-8vZUoVq35VEgfJy64XE",
  authDomain: "ouga-boga.firebaseapp.com",
  databaseURL: "https://ouga-boga-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ouga-boga",
  appId: "1:1093562379536:web:a060fb4f333d5f9d020995"
});

const auth = firebase.auth();
const db = firebase.database();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let localPlayer={}, players={}, bullets={}, roomId=null;
let isPlaying=false;

auth.signInAnonymously();

function uid(){ return auth.currentUser.uid; }
function randCode(){ return Math.random().toString(36).substr(2,4).toUpperCase(); }

createBtn.onclick = ()=> joinRoom(randCode());
joinBtn.onclick = ()=> joinRoom(roomInput.value.toUpperCase());

function joinRoom(code){
  roomId=code;
  roomCode.textContent=roomId;
  localPlayer={id:uid(),x:100,y:100,vx:0,vy:0,hp:100,alive:true,dir:0};
  db.ref(`rooms/${roomId}/players/${localPlayer.id}`).set(localPlayer);
  db.ref(`rooms/${roomId}/players/${localPlayer.id}`).onDisconnect().remove();

  db.ref(`rooms/${roomId}/players`).on("value", snap=>{
    players=snap.val()||{};
    playersCount.textContent=Object.keys(players).length;

    if(!players[localPlayer.id]){
      players[localPlayer.id]=localPlayer;
    }
  });

  db.ref(`rooms/${roomId}/meta`).on("value", snap=>{
    if(snap.val()?.started){
      isPlaying=true;
      status.textContent="Match Started!";
    }
  });

  status.textContent="Connected";
}

startBtn.onclick=()=>{
  isPlaying=true;
  status.textContent="Match Started!";
  db.ref(`rooms/${roomId}/meta`).set({started:true});
};

function shoot(){
  if(!isPlaying) return;
  const id="b"+Math.random();
  bullets[id]={x:localPlayer.x,y:localPlayer.y,vx:Math.cos(localPlayer.dir)*8,vy:Math.sin(localPlayer.dir)*8};
}

canvas.onclick = e=>{
  localPlayer.dir=Math.atan2(e.offsetY-localPlayer.y,e.offsetX-localPlayer.x);
  shoot();
};

function loop(){
  if(keys.w) localPlayer.y-=3;
  if(keys.s) localPlayer.y+=3;
  if(keys.a) localPlayer.x-=3;
  if(keys.d) localPlayer.x+=3;

  if(roomId){
    db.ref(`rooms/${roomId}/players/${localPlayer.id}`).update({
      x:localPlayer.x,y:localPlayer.y
    });
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(const id in players){
    const p=players[id];
    ctx.beginPath();
    ctx.arc(p.x,p.y,15,0,Math.PI*2);
    ctx.fillStyle=id===localPlayer.id?"cyan":"red";
    ctx.fill();
  }

  for(const id in bullets){
    const b=bullets[id];
    b.x+=b.vx; b.y+=b.vy;
    ctx.beginPath();
    ctx.arc(b.x,b.y,4,0,Math.PI*2);
    ctx.fillStyle="yellow";
    ctx.fill();
  }

  requestAnimationFrame(loop);
}

let keys={};
onkeydown=e=>keys[e.key]=true;
onkeyup=e=>keys[e.key]=false;

loop();
</script>
</body>
</html>
